<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 阿格蝦 Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }
        .header h1 { font-size: 2.5em; margin-bottom: 10px; }
        .header .emoji { font-size: 3em; }
        .status-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        .status-card {
            background: rgba(255,255,255,0.1);
            padding: 20px 30px;
            border-radius: 12px;
            text-align: center;
            min-width: 150px;
            backdrop-filter: blur(10px);
            transition: transform 0.3s;
        }
        .status-card:hover { transform: translateY(-5px); }
        .status-card .label { font-size: 0.9em; opacity: 0.8; }
        .status-card .value { font-size: 1.8em; font-weight: bold; margin-top: 5px; }
        .status-card.ok .value { color: #4ade80; }
        .status-card.warn .value { color: #fbbf24; }
        .status-card.error .value { color: #f87171; }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }
        .card h2 {
            font-size: 1.3em;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card h2 .icon { font-size: 1.2em; }
        
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.1); }
        th { font-weight: 600; opacity: 0.7; font-size: 0.85em; text-transform: uppercase; }
        tr:hover { background: rgba(255,255,255,0.05); }
        
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75em;
            font-weight: 600;
        }
        .badge.ok { background: #4ade80; color: #000; }
        .badge.run { background: #60a5fa; color: #000; }
        .badge.err { background: #f87171; color: #000; }
        .badge.wait { background: #fbbf24; color: #000; }
        
        .refresh-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            margin-top: 20px;
            transition: transform 0.2s;
        }
        .refresh-btn:hover { transform: scale(1.05); }
        
        .log-entry {
            font-family: monospace;
            font-size: 0.85em;
            padding: 8px 12px;
            margin: 5px 0;
            background: rgba(0,0,0,0.3);
            border-radius: 6px;
            border-left: 3px solid #667eea;
        }
        .log-entry.error { border-left-color: #f87171; }
        .log-entry.success { border-left-color: #4ade80; }
        
        .timestamp { opacity: 0.5; font-size: 0.8em; }
        
        .footer {
            text-align: center;
            opacity: 0.5;
            font-size: 0.8em;
            margin-top: 30px;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .live { animation: pulse 2s infinite; }
    </style>
</head>
<body>
    <div class="header">
        <div class="emoji">🦐</div>
        <h1>阿格蝦 Dashboard</h1>
        <p class="live">● Live Status</p>
    </div>
    
    <div class="status-bar">
        <div class="status-card ok">
            <div class="label">Gateway</div>
            <div class="value" id="gateway-status">Loading...</div>
        </div>
        <div class="status-card ok">
            <div class="label">Active Agents</div>
            <div class="value" id="agent-count">-</div>
        </div>
        <div class="status-card ok">
            <div class="label">Cron Jobs</div>
            <div class="value" id="cron-count">-</div>
        </div>
        <div class="status-card ok">
            <div class="label">Uptime</div>
            <div class="value" id="uptime">-</div>
        </div>
    </div>
    
    <div class="grid">
        <div class="card">
            <h2><span class="icon">🤖</span> Agent 狀態</h2>
            <table id="agents-table">
                <thead>
                    <tr>
                        <th>Agent</th>
                        <th>Model</th>
                        <th>狀態</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
        
        <div class="card">
            <h2><span class="icon">⏰</span> Cron Jobs</h2>
            <table id="cron-table">
                <thead>
                    <tr>
                        <th>名稱</th>
                        <th>下次執行</th>
                        <th>狀態</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
        
        <div class="card">
            <h2><span class="icon">📊</span> Model 使用統計</h2>
            <table id="model-table">
                <thead>
                    <tr>
                        <th>Model</th>
                        <th>使用次數</th>
                        <th>Tokens</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
        
        <div class="card">
            <h2><span class="icon">📜</span> 最近活動</h2>
            <div id="activity-log"></div>
        </div>
    </div>
    
    <div class="card">
        <h2><span class="icon">🔧</span> 指令處理紀錄</h2>
        <table id="commands-table">
            <thead>
                <tr>
                    <th>時間</th>
                    <th>類型</th>
                    <th>內容</th>
                    <th>狀態</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
    
    <div style="text-align: center;">
        <button class="refresh-btn" onclick="refreshAll()">🔄 重新整理</button>
    </div>
    
    <div class="footer">
        <p>🦐 阿格蝦 Dashboard | 更新時間: <span id="last-update">-</span></p>
    </div>

    <script>
        const state = {
            commands: [],
            activities: [],
            models: {}
        };
        
        // 模擬數據（實際應從 API 獲取）
        function generateMockData() {
            const now = Date.now();
            const agents = [
                { id: 'main', name: '阿格蝦', model: 'MiniMax-M2.5', status: 'ok' },
                { id: 'coder', name: 'Coder', model: 'MiniMax-M2.5', status: 'ok' },
                { id: 'qa', name: 'QA', model: 'MiniMax-M2.1', status: 'ok' },
                { id: 'devops', name: 'DevOps', model: 'MiniMax-M2.1', status: 'wait' },
                { id: 'researcher', name: 'Researcher', model: 'MiniMax-M2.5', status: 'ok' }
            ];
            
            const cronJobs = [
                { name: 'hourly-todo-report', nextRun: '2026-03-06 12:00', status: 'ok' },
                { name: 'daily-moltbook-explore', nextRun: '2026-03-07 09:00', status: 'ok' }
            ];
            
            const commands = [
                { time: '11:38', type: 'user', content: '建立 Dashboard', status: 'ok' },
                { time: '11:04', type: 'cron', content: '待辦清單回報', status: 'ok' },
                { time: '10:04', type: 'cron', content: '待辦清單回報', status: 'ok' },
                { time: '09:04', type: 'cron', content: '待辦清單回報', status: 'ok' },
                { time: '08:04', type: 'cron', content: '待辦清單回報', status: 'ok' },
                { time: '07:04', type: 'cron', content: '待辦清單回報', status: 'ok' },
                { time: '01:02', type: 'cron', content: 'Moltbook 探索', status: 'ok' },
                { time: '昨天', type: 'user', content: 'Moltbook 發文', status: 'ok' }
            ];
            
            const activities = [
                { time: '11:38', text: '建立 Dashboard 功能', type: 'success' },
                { time: '11:36', text: '安裝系統設計技能', type: 'success' },
                { time: '05:28', text: 'Moltbook 發文成功', type: 'success' },
                { time: '昨天', text: 'IT 春酒網站上線', type: 'success' }
            ];
            
            const modelStats = [
                { name: 'MiniMax-M2.5', count: 156, tokens: '2.4M' },
                { name: 'MiniMax-M2.1', count: 89, tokens: '1.1M' }
            ];
            
            return { agents, cronJobs, commands, activities, modelStats };
        }
        
        function renderAgents(agents) {
            const tbody = document.querySelector('#agents-table tbody');
            tbody.innerHTML = agents.map(a => `
                <tr>
                    <td>${a.name}</td>
                    <td><span class="badge run">${a.model}</span></td>
                    <td><span class="badge ${a.status}">${a.status === 'ok' ? '正常' : '等待'}</span></td>
                </tr>
            `).join('');
            document.getElementById('agent-count').textContent = agents.length;
        }
        
        function renderCron(jobs) {
            const tbody = document.querySelector('#cron-table tbody');
            tbody.innerHTML = jobs.map(j => `
                <tr>
                    <td>${j.name}</td>
                    <td>${j.nextRun}</td>
                    <td><span class="badge ok">${j.status === 'ok' ? '正常' : '錯誤'}</span></td>
                </tr>
            `).join('');
            document.getElementById('cron-count').textContent = jobs.length;
        }
        
        function renderCommands(commands) {
            const tbody = document.querySelector('#commands-table tbody');
            tbody.innerHTML = commands.map(c => `
                <tr>
                    <td class="timestamp">${c.time}</td>
                    <td><span class="badge run">${c.type}</span></td>
                    <td>${c.content}</td>
                    <td><span class="badge ok">${c.status}</span></td>
                </tr>
            `).join('');
        }
        
        function renderActivities(activities) {
            const container = document.getElementById('activity-log');
            container.innerHTML = activities.map(a => `
                <div class="log-entry ${a.type}">
                    <span class="timestamp">${a.time}</span> ${a.text}
                </div>
            `).join('');
        }
        
        function renderModels(models) {
            const tbody = document.querySelector('#model-table tbody');
            tbody.innerHTML = models.map(m => `
                <tr>
                    <td><span class="badge run">${m.name}</span></td>
                    <td>${m.count}</td>
                    <td>${m.tokens}</td>
                </tr>
            `).join('');
        }
        
        function updateTime() {
            const now = new Date();
            document.getElementById('last-update').textContent = now.toLocaleString('zh-TW');
            
            // 計算運行時間
            const startTime = new Date('2026-03-01T00:00:00Z');
            const diff = now - startTime;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            document.getElementById('uptime').textContent = `${days} 天`;
            
            // Gateway 狀態
            document.getElementById('gateway-status').textContent = '✅';
        }
        
        function refreshAll() {
            const data = generateMockData();
            renderAgents(data.agents);
            renderCron(data.cronJobs);
            renderCommands(data.commands);
            renderActivities(data.activities);
            renderModels(data.modelStats);
            updateTime();
        }
        
        // 初始載入
        refreshAll();
        
        // 每 30 秒自動更新
        setInterval(refreshAll, 30000);
    </script>
</body>
</html>
